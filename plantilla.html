<!doctype html>
<!--
  Viajes &amp; Wallpapers · Plantilla común (plantilla.html)
  Práctica UT1 · Diseño de Interfaces Web · 2.º DAW · IES Juan de la Cierva
  Plantilla común (paso 8 del enunciado). Para crear una página nueva: copiad este archivo,
  cambiad el title y escribid el contenido en la ZONA VARIABLE del main. No toquéis las
  PARTES COMUNES: así todas las páginas tienen el mismo menú y el mismo pie. Si hay que
  cambiar una parte común, cambiadla aquí y en todas las páginas.
  Así hemos creado aviso-legal.html, privacidad.html y cookies.html.
-->
<html lang="es">
  <head>
    <!-- ===== PARTE COMÚN: no tocar ===== -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />

    <!-- ===== ZONA VARIABLE: el título, con el formato «Nombre - Viajes &amp; Wallpapers» ===== -->
    <title>Título de la página - Viajes &amp; Wallpapers</title>

    <!-- ===== PARTE COMÚN: no tocar ===== -->
    <!-- Tipografías de nuestra guía de estilo (paso 2): Libre Baskerville para títulos y DM Sans para texto, desde Google Fonts. Este enlace va antes de estilos.css y los preconnect adelantan la conexión. Si cambiáis de fuente, cambiad este enlace en todas las páginas y las variables de fuente del CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap" />
    <!-- Hoja de estilos única de la web (paso 1). Todo el estilo va en css/estilos.css: no uséis style= ni bloques style -->
    <link rel="stylesheet" href="css/estilos.css" />
    <!-- Icono de la pestaña: el cuadrado de nuestra marca -->
    <link rel="icon" href="img/icono/favicon.svg" type="image/svg+xml" />
  </head>

  <body id="arriba">
    <!-- ===== PARTE COMÚN: no tocar ===== -->
    <!-- CABECERA: zona «cabecera» del grid del body (paso 3). La marca enlaza siempre a la portada -->
    <header class="cabecera">
      <a class="marca" href="index.html">
        <span class="marca__simbolo"></span>
        Viajes &amp; Wallpapers
      </a>
    </header>

    <!-- MENÚ (paso 4): zona «menu» del grid, con display: flex en el ul. aria-current="page" va en el enlace de la página en la que estamos y es lo que la marca como activa. Si añadís una página al menú, añadid su li en todas las páginas y en plantilla.html -->
    <!-- Al crear una página, poned aria-current="page" en su enlace. Las páginas legales no están en el menú: se marcan en el pie -->
    <nav class="menu" aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="fotos.html">Fotos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL: zona «principal» del grid. Un solo main y un solo h1 por página, con los títulos en orden (h1, h2, h3) sin saltar niveles -->
    <main class="principal">
      <!-- ===== ZONA VARIABLE: el contenido de la página, con un solo h1 ===== -->
    </main>

    <!-- ===== PARTE COMÚN: no tocar ===== -->
    <!-- PIE (paso 8): zona «pie» del grid, igual en todas las páginas, con los enlaces legales. Si cambiáis algo del pie, cambiadlo en todas las páginas y en plantilla.html -->
    <footer class="pie">
      <div class="pie__fila">
        <a class="marca" href="index.html">
          <span class="marca__simbolo"></span>
          Viajes &amp; Wallpapers
        </a>
        <nav aria-label="Menú del pie">
          <ul class="pie__lista pie__lista--barras">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="fotos.html">Fotos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>

      <div class="pie__fila pie__legal">
        <p>&copy; 2026 Viajes &amp; Wallpapers. Todos los derechos reservados.</p>
        <!-- En una página legal, poned aria-current="page" en su enlace de esta lista -->
        <ul class="pie__lista">
          <li><a href="aviso-legal.html">Aviso legal</a></li>
          <li><a href="privacidad.html">Privacidad</a></li>
          <li><a href="cookies.html">Cookies</a></li>
        </ul>
        <p>
          Contacta con nosotros en:
          <a href="mailto:info@viajeswallpapers.com">info@viajeswallpapers.com</a>
        </p>
      </div>
    </footer>
  </body>
</html>
